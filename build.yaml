# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: seeeduino_xiao_ble
    shield: splitkb_aurora_lily58_dongle prospector_adapter
  - board: nice_nano_v2
    shield: splitkb_aurora_lily58_left nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: splitkb_aurora_lily58_right nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: settings_reset
  - board:  seeeduino_xiao_ble
    shield: settings_reset